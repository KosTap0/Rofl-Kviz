const state = { score: 0, stage: 0, totalStages: 11 };
const gameEl = document.getElementById('game');
const scoreEl = document.getElementById('score');
const stageEl = document.getElementById('stage');
const progressEl = document.getElementById('progress');

function updateHUD() {
  scoreEl.textContent = state.score;
  stageEl.textContent = Math.min(state.stage + 1, state.totalStages);
  progressEl.innerHTML = '';
  for (let i = 0; i < state.totalStages; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    if (i < state.stage) d.classList.add('done');
    else if (i === state.stage) d.classList.add('active');
    progressEl.appendChild(d);
  }
}
function addScore(n) { state.score += n; scoreEl.textContent = state.score; }
function nextStage() { state.stage++; updateHUD(); runStage(state.stage); }
function normalize(s) {
  return s.toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9]/g, '');
}
function checkAnswer(user, correctList) {
  const u = normalize(user);
  if (!u) return false;
  return correctList.some(c => {
    const cc = normalize(c);
    return u === cc || u.includes(cc) || cc.includes(u);
  });
}
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffleOptions(answers, correctIndex) {
  return shuffleArray(answers.map((text, i) => ({ text, correct: i === correctIndex })));
}

function stageQuiz() {
  let idx = 0, stageScore = 0;
  const perQ = 10;
  function render() {
    if (idx >= quizData.length) {
      addScore(stageScore);
      gameEl.innerHTML = `
        <h2>🤣 Викторина пройдена!</h2>
        <div class="big-emoji">🎉</div>
        <p class="center">Ты заработал <b>${stageScore}</b> очков на этом этапе!</p>
        <button class="btn" onclick="nextStage()">Дальше ➡️</button>
      `;
      return;
    }
    const q = quizData[idx];
    const shuffled = shuffleOptions(q.a, q.c);
    gameEl.innerHTML = `
      <p class="center" style="color:#764ba2; font-weight:bold;">Вопрос ${idx+1} из ${quizData.length}</p>
      <div class="rofl-hint">🤣 Выбирай САМЫЙ СМЕШНОЙ вариант!</div>
      <h2>${q.q}</h2>
      <div id="answers"></div>
      <div class="feedback" id="fb"></div>
    `;
    const answersEl = document.getElementById('answers');
    const fb = document.getElementById('fb');
    shuffled.forEach((opt) => {
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = opt.text;
      b.onclick = () => {
        if (answersEl.dataset.answered) return;
        answersEl.dataset.answered = '1';
        answersEl.querySelectorAll('button').forEach((bb, j) => {
          if (shuffled[j].correct) bb.classList.add('correct');
          else if (bb === b) bb.classList.add('wrong');
          bb.disabled = true;
        });
        if (opt.correct) {
          stageScore += perQ;
          fb.textContent = '🤣 Ты шаришь! +' + perQ + '. ' + q.j;
          fb.className = 'feedback good';
        } else {
          const funny = q.a[q.c];
          fb.textContent = '😐 Ну не, вот было ржачнее: «' + funny + '». ' + q.j;
          fb.className = 'feedback bad';
        }
        setTimeout(() => { idx++; render(); }, 2600);
      };
      answersEl.appendChild(b);
    });
  }
  render();
}

/* ============== 8. ПАМЯТЬ ============== */
function stageMemory() {
  const emojis = ['🐱', '🍕', '🚀', '🐸', '🐼', '🍦', '🎮', '🌈', '🦄', '🐧'];
  const cards = shuffleArray([...emojis, ...emojis]);
  let flipped = [], matched = 0, moves = 0, lock = false;

  gameEl.innerHTML = `
    <h2>🧠 Найди пары!</h2>
    <p class="center">Открывай карточки и находи одинаковые. ${emojis.length} пар ждут тебя! Чем меньше ходов — тем больше очков.</p>
    <div class="memory-grid" id="grid"></div>
    <div class="feedback" id="fb"></div>
  `;
  const grid = document.getElementById('grid');
  const fb = document.getElementById('fb');

  cards.forEach((emoji) => {
    const c = document.createElement('div');
    c.className = 'card';
    c.dataset.emoji = emoji;
    c.textContent = emoji;
    c.onclick = () => {
      if (lock) return;
      if (c.classList.contains('flipped') || c.classList.contains('matched')) return;
      c.classList.add('flipped');
      flipped.push(c);
      if (flipped.length === 2) {
        lock = true; moves++;
        if (flipped[0].dataset.emoji === flipped[1].dataset.emoji) {
          setTimeout(() => {
            flipped[0].classList.add('matched');
            flipped[1].classList.add('matched');
            matched++;
            flipped = []; lock = false;
            if (matched === emojis.length) {
              const pts = Math.max(40, 150 - moves * 3);
              addScore(pts);
              fb.textContent = `🎉 Нашёл все пары за ${moves} ходов! +${pts} очков`;
              fb.className = 'feedback good';
              setTimeout(() => {
                gameEl.innerHTML = `
                  <h2>🧠 Память прокачана!</h2>
                  <div class="big-emoji">🐘</div>
                  <p class="center">Ты заработал <b>${pts}</b> очков!</p>
                  <button class="btn" onclick="nextStage()">Дальше ➡️</button>
                `;
              }, 1800);
            }
          }, 400);
        } else {
          setTimeout(() => {
            flipped[0].classList.remove('flipped');
            flipped[1].classList.remove('flipped');
            flipped = []; lock = false;
          }, 850);
        }
      }
    };
    grid.appendChild(c);
  });
}

      addScore(roundScore);
      gameEl.innerHTML = `
        <h2>⚡ Реакция прокачана!</h2>
        <div class="big-emoji">⚡</div>
        <p class="center">Ты заработал <b>${roundScore}</b> очков!</p>
        <button class="btn" onclick="nextStage()">Дальше ➡️</button>
      `;
      return;
    }
    round++;
    gameEl.innerHTML = `
      <p class="center" style="color:#764ba2; font-weight:bold;">Раунд ${round} из ${totalRounds}</p>
      <h2>⚡ Ловкость рук</h2>
      <p class="center">Жди, пока кнопка станет зелёной, и жми как можно быстрее!</p>
      <button class="btn" id="reactBtn">⏳ Жди...</button>
      <div class="feedback" id="fb"></div>
    `;
    const btn = document.getElementById('reactBtn');
    const fb = document.getElementById('fb');
    let ready = false, clicked = false, readyTime = 0;
    const delay = 1500 + Math.random() * 3500;
    btn.onclick = () => {
      if (clicked) return;
      clicked = true; btn.disabled = true;
      if (!ready) {
        fb.textContent = '😱 Слишком рано! Раунд провален!';
        fb.className = 'feedback bad';
      } else {
        const time = Date.now() - readyTime;
        let pts = 0;
        if (time < 300) pts = 25;
        else if (time < 500) pts = 20;
        else if (time < 800) pts = 15;
        else if (time < 1500) pts = 10;
        else pts = 5;
        roundScore += pts;
        fb.textContent = `⚡ Реакция: ${time} мс! +${pts} очков`;
        fb.className = 'feedback good';
      }
      setTimeout(startRound, 1800);
    };
    setTimeout(() => {
      ready = true; readyTime = Date.now();
      if (clicked) return;
      btn.textContent = '🔥 ЖМИ!';
      btn.style.background = 'linear-gradient(135deg, #4caf50, #2e7d32)';
      btn.style.boxShadow = '0 4px 0 #1b5e20';
    }, delay);
  }
  startRound();
}

/* ============== 10. БЛИЦ С ТАЙМЕРОМ ============== */
function stageBlitz() {
  let idx = 0, stageScore = 0;
  const perQ = 15;
  const TIME_LIMIT = 15;
  let timerId = null;
  let answered = false;

  function render() {
    if (idx >= blitzData.length) {
      if (timerId) clearInterval(timerId);
      addScore(stageScore);
      gameEl.innerHTML = `
        <h2>✅ Блиц пройден!</h2>
        <div class="big-emoji">⏱️</div>
        <p class="center">Ты заработал <b>${stageScore}</b> очков!</p>
        <button class="btn" onclick="nextStage()">Финал ➡️</button>
      `;
      return;
    }
    const q = blitzData[idx];
    answered = false;
    gameEl.innerHTML = `
      <p class="center" style="color:#764ba2; font-weight:bold;">Блиц ${idx+1} из ${blitzData.length} — у тебя ${TIME_LIMIT} секунд!</p>
      <h2>⚡ ${q.q}</h2>
      <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
      <input class="input" id="ansInput" placeholder="Быстрее!" autocomplete="off">
      <button class="btn" id="checkBtn">Ответить ✅</button>
      <div class="feedback" id="fb"></div>
    `;
    const input = document.getElementById('ansInput');
    const btn = document.getElementById('checkBtn');
    const fb = document.getElementById('fb');
    const timerFill = document.getElementById('timerFill');

    let timeLeft = TIME_LIMIT;
    if (timerId) clearInterval(timerId);
    timerId = setInterval(() => {
      timeLeft--;
      const pct = Math.max(0, (timeLeft / TIME_LIMIT) * 100);
      timerFill.style.width = pct + '%';
      if (timeLeft <= 5) timerFill.className = 'timer-fill danger';
      else if (timeLeft <= 10) timerFill.className = 'timer-fill warn';
      if (timeLeft <= 0) {
        clearInterval(timerId);
        if (!answered) finish(false);
      }
    }, 1000);

    const finish = (isCorrect) => {
      if (answered) return;
      answered = true;
      if (timerId) clearInterval(timerId);
      input.disabled = true; btn.disabled = true;
      if (isCorrect) {
        stageScore += perQ;
        fb.textContent = `⚡ Верно! +${perQ}. ${q.j}`;
        fb.className = 'feedback good';
      } else {
        fb.textContent = `⏰ Время вышло или мимо! Правильно: ${q.a[0]}`;
        fb.className = 'feedback bad';
      }
      setTimeout(() => { idx++; render(); }, 1800);
    };

    const check = () => {
      const val = input.value.trim();
      if (!val) return;
      finish(checkAnswer(val, q.a));
    };
    btn.onclick = check;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    input.focus();
  }
  render();
}

/* ============== 11. ФИНАЛ ============== */
function stageFinal() {
  const s = state.score;
  let rank, emoji, desc;
  if (s >= 1000) { rank = 'ЛЕГЕНДА РОФЛА'; emoji = '🏆👑🤣'; desc = 'Ты абсолютный король шуток! Даже коты завидуют твоему чувству юмора.'; }
  else if (s >= 800) { rank = 'МЕГА-РОФЛЕР'; emoji = '🌟😎🎉'; desc = 'Почти легенда! Ещё чуть-чуть — и статуя в твою честь.'; }
  else if (s >= 600) { rank = 'КРУТОЙ ШУТНИК'; emoji = '😄🎈🍕'; desc = 'Отличный результат! Ты явно в теме.'; }
  else if (s >= 400) { rank = 'ВЕСЁЛЫЙ НОВИЧОК'; emoji = '😊🌈🍭'; desc = 'Неплохо! Но можно ещё громче ржать!'; }
  else if (s >= 200) { rank = 'ЮНЫЙ РОФЛЕР'; emoji = '🙂🍪🐣'; desc = 'Начало положено! Тренируй чувство юмора дальше.'; }
  else { rank = 'ПУШИСТЫЙ КОТИК'; emoji = '🐱💤☁️'; desc = 'Ну... главное — весело провели время! Мур-мур.'; }

  updateHUD();
  gameEl.innerHTML = `
    <h1>🎉 ФИНАЛ! 🎉</h1>
    <div class="big-emoji">${emoji}</div>
    <p class="center">Твой финальный счёт:</p>
    <div class="score-big">${s}</div>
    <h2>Твой титул: ${rank}</h2>
    <p class="center">${desc}</p>
    <p class="center" style="margin-top:20px;">Спасибо за игру! Покажи свой результат друзьям и предложи побить рекорд! 😜</p>
    <button class="btn" onclick="startScreen()">🔁 Играть снова</button>
  `;
}

/* ============== ЗАПУСК ============== */
const stageFns = [
  stageQuiz, stageTF, stageEmoji, stageAnagram, stageMath,
  stageRiddles, stageLogic, stageMemory, stageReaction, stageBlitz, stageFinal
];

function runStage(i) {
  if (i >= stageFns.length) { stageFinal(); return; }
  stageFns[i]();
}

startScreen();
</script>
