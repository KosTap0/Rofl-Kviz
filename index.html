<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рофл Квиз — для ведущего</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Comic Sans MS', system-ui, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);

  }
  #app {
    background: #fff; border-radius: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    padding: 30px; max-width: 1100px; width: 100%;
    min-height: 600px; display: flex; flex-direction: column;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; font-size: 18px; font-weight: bold;
    color: #764ba2; gap: 20px; flex-wrap: wrap;
  }
  .progress { display: flex; gap: 5px; margin-bottom: 20px; }
  .progress .dot { flex: 1; height: 8px; background: #e0e0e0; border-radius: 4px; transition: 0.3s; }
  .progress .dot.done { background: #4caf50; }
  .progress .dot.active { background: #764ba2; }
  #game { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 48px; text-align: center; margin-bottom: 20px; color: #6a1b9a; line-height: 1.2; }
  h2 { font-size: 32px; text-align: center; margin-bottom: 20px; color: #6a1b9a; }
  p { font-size: 20px; margin-bottom: 14px; line-height: 1.5; }
  .question-text {
    font-size: 34px; text-align: center; margin: 30px 0;
    line-height: 1.3; font-weight: bold; color: #2c2c54;
  }
  .options-list { list-style: none; max-width: 800px; margin: 0 auto 20px; }
  .options-list li {
    background: #f3e5f5; padding: 16px 24px; margin: 10px 0;
    border-radius: 14px; font-size: 22px; border-left: 6px solid #764ba2;
  }
  .answer-box {
    background: #e8f5e9; border: 4px solid #4caf50;
    border-radius: 20px; padding: 25px 30px; text-align: center;
    margin: 20px auto 25px; max-width: 800px; animation: pop 0.4s ease;
  }
  .answer-box .label {
    font-size: 16px; color: #2e7d32; margin-bottom: 10px;
    text-transform: uppercase; letter-spacing: 2px; font-weight: bold;
  }
  .answer-box .answer-text {
    font-size: 40px; font-weight: bold; color: #1b5e20; word-wrap: break-word;
  }
  .answer-box .hint { font-size: 18px; color: #555; margin-top: 15px; font-style: italic; }
  @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .btn {
    display: block; width: 100%; padding: 20px; margin: 10px 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border: none; border-radius: 16px;
    font-size: 22px; font-family: inherit; cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    box-shadow: 0 5px 0 #4a2d80; font-weight: bold;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #4a2d80; }
  .btn:active { transform: translateY(2px); box-shadow: 0 3px 0 #4a2d80; }
  .btn.reveal { background: linear-gradient(135deg, #ff9800, #f57c00); box-shadow: 0 5px 0 #e65100; }
  .btn.next { background: linear-gradient(135deg, #4caf50, #2e7d32); box-shadow: 0 5px 0 #1b5e20; }
  .btn-row { margin-top: 20px; }
  .note { text-align: center; font-size: 14px; color: #999; margin-top: 10px; font-style: italic; }
  .stage-screen { text-align: center; padding: 20px; }
  .stage-emoji { font-size: 120px; margin: 20px 0; line-height: 1; }
  .stage-title { font-size: 56px; color: #6a1b9a; font-weight: bold; margin-bottom: 20px; line-height: 1.1; }
  .stage-desc { font-size: 22px; color: #555; max-width: 700px; margin: 0 auto 25px; line-height: 1.5; }
  .stage-info {
    display: inline-block; background: #f3e5f5; padding: 14px 30px;
    border-radius: 30px; font-size: 20px; color: #764ba2; font-weight: bold; margin-top: 10px;
  }
  .counter {
    text-align: center; font-size: 18px; color: #764ba2;
    font-weight: bold; margin-bottom: 10px;
  }
  .final-titles {
    background: #f3e5f5; padding: 25px; border-radius: 20px;
    margin: 20px auto; max-width: 700px; text-align: left;
    font-size: 18px; line-height: 1.8;
  }
  @media (max-width: 700px) {
    .question-text { font-size: 24px; }
    .options-list li { font-size: 16px; padding: 12px 18px; }
    .answer-box .answer-text { font-size: 26px; }
    .stage-title { font-size: 36px; }
    .stage-emoji { font-size: 80px; }
    .btn { font-size: 18px; padding: 16px; }
    h1 { font-size: 32px; }
  }
</style>
</head>

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

      { q: "👓🪄", a: "Гарри Поттер", hint: "Волшебник" }
    ]
  },
  {
    title: "АНАГРАММЫ",
    emoji: "📝",
    description: "Ведущий показывает перемешанные буквы и подсказку. Игроки пишут получившееся слово.",
    points: 15,
    questions: [
      { q: "ТОК", a: "КОТ", hint: "Мяукает и спит 20 часов в сутки" },
      { q: "ЦАЦИП", a: "ПИЦЦА", hint: "Круглая, с сыром" },
      { q: "МОСКОС", a: "КОСМОС", hint: "Звёзды, планеты, ракеты" },

      { q: "БРАЗЕ", a: "ЗЕБРА", hint: "Вся в полосочку" },
      { q: "ШКАКО", a: "КОШКА", hint: "Гуляет сама по себе" },
      { q: "ЗДАВЕЗ", a: "ЗВЕЗДА", hint: "Светится ночью" }
    ]
  },
  {
    title: "ЗАГАДКИ",

    description: "Ведущий читает загадку. Игроки пишут на листочке ответ.",

    questions: [
      { q: "Что тяжелее: 1 кг железа или 1 кг ваты?", a: "ОДИНАКОВО", hint: "Классика на внимательность" },

      { q: "Сколько цветов у радуги?", a: "7", hint: "Не 6, не 8 — ровно 7" }

const state = {
  stageIndex: 0,
  questionIndex: 0,
  answerShown: false,
  screen: 'start',
  currentOptions: null,
  currentCorrectIdx: -1
};

const gameEl = document.getElementById('game');
const stageLabelEl = document.getElementById('stage-label');
const qCounterEl = document.getElementById('q-counter');
const progressEl = document.getElementById('progress');

function updateHeader() {
  progressEl.innerHTML = '';
  for (let i = 0; i < stages.length; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    if (i < state.stageIndex) d.classList.add('done');
    else if (i === state.stageIndex && state.screen !== 'start') d.classList.add('active');
    progressEl.appendChild(d);
  }
  if (state.screen === 'start') {
    stageLabelEl.textContent = 'Рофл Квиз';
    qCounterEl.textContent = '';
  } else if (state.screen === 'stage-intro') {
    stageLabelEl.textContent = `Этап ${state.stageIndex + 1} / ${stages.length}`;
    qCounterEl.textContent = stages[state.stageIndex].title;
  } else if (state.screen === 'question') {
    const st = stages[state.stageIndex];
    stageLabelEl.textContent = `Этап ${state.stageIndex + 1} / ${stages.length} · ${st.title}`;
    qCounterEl.textContent = `Вопрос ${state.questionIndex + 1} / ${st.questions.length}`;
  } else {
    stageLabelEl.textContent = `Этап ${state.stageIndex + 1} / ${stages.length}`;
    qCounterEl.textContent = '';
  }
}

function showStart() {
  state.screen = 'start';
  state.stageIndex = 0;
  state.questionIndex = 0;
  state.answerShown = false;
  updateHeader();
  const totalQuestions = stages.reduce((sum, st) => sum + st.questions.length, 0);
  gameEl.innerHTML = `
    <div class="stage-screen">
      <h1>🤪 РОФЛ КВИЗ 🤪</h1>
      <div class="stage-emoji">🎉🎮🍕</div>
      <p style="font-size: 22px; max-width: 800px; margin: 0 auto 20px;">
        Ведущий переключает вопросы на большом экране.<br>
        Игроки пишут ответы на листочках. Без телефонов, всё по-честному!
      </p>
      <p style="font-size: 20px; color: #764ba2; margin-bottom: 15px;">
        ⏱️ Примерное время: <b>35–45 минут</b><br>
        ${stages.length} этапов · ${totalQuestions} вопросов · много рофла
      </p>
      <p style="font-size: 16px; color: #999; margin-bottom: 30px; font-style: italic;">
        Совет: открывайте на большом экране или проекторе.<br>
        Клавиша <b>Пробел</b> — показать ответ / следующий вопрос.
      </p>
      <button class="btn" onclick="startGame()">🚀 Начать квиз</button>
    </div>
  `;
}

function startGame() {
  state.stageIndex = 0;
  state.questionIndex = 0;
  state.answerShown = false;
  showStageIntro();
}

function showStageIntro() {
  state.screen = 'stage-intro';
  updateHeader();
  const st = stages[state.stageIndex];
  gameEl.innerHTML = `
    <div class="stage-screen">
      <div class="stage-emoji">${st.emoji}</div>
      <div class="stage-title">${st.title}</div>
      <p class="stage-desc">${st.description}</p>
      <div class="stage-info">
        Вопросов: <b>${st.questions.length}</b> · Очков за верный ответ: <b>${st.points}</b>
      </div>
      <button class="btn" style="margin-top: 30px;" onclick="startStage()">▶️ Погнали!</button>
    </div>
  `;
}

function startStage() {
  state.questionIndex = 0;
  state.answerShown = false;
  showQuestion();
}

function showQuestion() {
  state.screen = 'question';
  state.answerShown = false;
  updateHeader();
  const st = stages[state.stageIndex];
  const q = st.questions[state.questionIndex];

  /* 🔀 Перемешиваем варианты для вопросов с выбором */
  if (q.o) {
    const paired = q.o.map((text, i) => ({ text, correct: i === q.a }));
    const shuffled = shuffleArray(paired);
    state.currentOptions = shuffled;
    state.currentCorrectIdx = shuffled.findIndex(p => p.correct);
  } else {
    state.currentOptions = null;
    state.currentCorrectIdx = -1;
  }

  let optionsHtml = '';
  if (q.o) {
    const letters = ['А', 'Б', 'В', 'Г'];
    optionsHtml = '<ul class="options-list">';
    state.currentOptions.forEach((opt, i) => {
      optionsHtml += `<li><b>${letters[i]})</b> ${opt.text}</li>`;
    });
    optionsHtml += '</ul>';
  }

  gameEl.innerHTML = `
    <div id="q-content">
      <div class="counter">Этап: ${st.title} · Вопрос ${state.questionIndex + 1} из ${st.questions.length} · За верный ответ: ${st.points} очков</div>
      <div class="question-text">${q.q}</div>
      ${optionsHtml}
    </div>
    <div class="btn-row">
      <button class="btn reveal" onclick="revealAnswer()">👀 Показать ответ</button>
      <div class="note">⚠️ Убедитесь, что все написали ответ</div>
    </div>
  `;
}

function revealAnswer() {
  if (state.answerShown) return;
  state.answerShown = true;
  const st = stages[state.stageIndex];
  const q = st.questions[state.questionIndex];

  let answerText;
  if (q.o && state.currentOptions) {
    const letters = ['А', 'Б', 'В', 'Г'];
    const correct = state.currentOptions[state.currentCorrectIdx];
    answerText = `${letters[state.currentCorrectIdx]}) ${correct.text}`;
  } else {
    answerText = q.a;
  }

  const hintHtml = q.hint ? `<div class="hint">${q.hint}</div>` : '';

  const answerBox = `
    <div class="answer-box">
      <div class="label">Правильный ответ</div>
      <div class="answer-text">${answerText}</div>
      ${hintHtml}
    </div>
  `;

  document.getElementById('q-content').insertAdjacentHTML('beforeend', answerBox);

  const btnRow = gameEl.querySelector('.btn-row');
  btnRow.innerHTML = `<button class="btn next" onclick="nextQuestion()">➡️ Дальше</button>`;
}

function nextQuestion() {
  const st = stages[state.stageIndex];
  if (state.questionIndex + 1 < st.questions.length) {
    state.questionIndex++;
    showQuestion();
  } else {
    showStageEnd();
  }
}

function showStageEnd() {
  state.screen = 'stage-end';
  updateHeader();
  const st = stages[state.stageIndex];
  const isLast = state.stageIndex + 1 >= stages.length;

  gameEl.innerHTML = `
    <div class="stage-screen">
      <div class="stage-emoji">${isLast ? '🏆' : '🎉'}</div>
      <h2>${isLast ? 'Это был последний этап!' : 'Этап пройден!'}</h2>
      <p style="font-size: 20px; max-width: 700px; margin: 20px auto;">
        ${isLast
          ? 'Поздравляем! Вы прошли весь Рофл Квиз! Ведущий подсчитывает очки, а мы объявляем финал.'
          : `«${st.title}» — готово! Посчитайте очки на листочках и погнали дальше.`}
      </p>
      <button class="btn" style="margin-top: 30px;" onclick="${isLast ? 'showFinal()' : 'nextStage()'}">
        ${isLast ? '🏆 К финалу' : '➡️ Следующий этап'}
      </button>
    </div>
  `;
}

function nextStage() {
  state.stageIndex++;
  showStageIntro();
}

function showFinal() {
  state.screen = 'final';
  updateHeader();
  gameEl.innerHTML = `
    <div class="stage-screen">
      <div class="stage-emoji">🏆🎉🤣</div>
      <h1>ФИНАЛ!</h1>
      <p style="font-size: 24px; max-width: 800px; margin: 20px auto;">
        Поздравляем всех! Вы прошли <b>«Рофл Квиз»</b>!
      </p>
      <div class="final-titles">
        <p style="font-size: 22px; margin-bottom: 15px; text-align: center;">
          <b>Ведущий, время подсчитать очки!</b>
        </p>
        <p><b>Титулы для награждения:</b></p>
        <p>🏆 <b>Легенда Рофла</b> — больше всех очков</p>
        <p>😂 <b>Самый громкий смех</b> — кто ржал громче всех</p>
        <p>🧠 <b>Самый умный</b> — больше всех правильных ответов</p>
        <p>🐱 <b>Пушистый котик</b> — самый скромный участник</p>
        <p>🎭 <b>Лучший актёр</b> — самый артистичный ответ</p>
      </div>
      <button class="btn" onclick="showStart()">🔁 Сыграть заново</button>
    </div>
  `;
}

document.addEventListener('keydown', (e) => {
  if (state.screen !== 'question') return;
  if (e.target.tagName === 'BUTTON') return;
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (state.answerShown) nextQuestion();
    else revealAnswer();
  }
});

showStart();
</script>
</body>
</html>
